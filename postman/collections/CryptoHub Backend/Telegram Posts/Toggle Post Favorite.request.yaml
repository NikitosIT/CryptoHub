$kind: http-request
description: Adds the post to favorites if it is not favorited yet, otherwise removes it and returns the updated favorite state.
url: "{{apiBaseUrl}}/posts/favorites"
method: POST
headers:
  Content-Type: application/json
  Authorization: "Bearer {{authToken}}"
body:
  type: json
  content: |-
    {
      "postId": 42
    }
order: 3000

$kind: http-request
description: |-
  Starts an AI-powered crypto chat stream. The response is delivered via SSE (Server-Sent Events) with JSON-encoded events:

  - `{"type":"init","chatId":"..."}` — chat record created
  - `{"type":"chunk","content":"..."}` — text chunks
  - `{"type":"done"}` — completed
  - `{"type":"error","message":"..."}` — error

  Available actions: TOKEN_FORECAST
  Limit: 3 requests per day.
url: "{{apiBaseUrl}}/crypto-ai/chat/stream"
method: POST
headers:
  Content-Type: application/json
  Authorization: "Bearer {{authToken}}"
body:
  type: json
  content: |-
    {
      "action": "TOKEN_FORECAST",
      "tokenSymbol": "BTC"
    }
order: 1000

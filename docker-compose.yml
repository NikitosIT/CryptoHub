services:
  postgres:
    image: postgres:17
    container_name: crypto_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    image: dpage/pgadmin4:9.5
    container_name: crypto_pgadmin
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5050:80"
    entrypoint:
      - /bin/sh
      - -c
      - |
        cat > /pgadmin4/servers.json <<EOF
        {
          "Servers": {
            "1": {
              "Name": "CryptoHub Postgres",
              "Group": "Local",
              "Host": "$$POSTGRES_HOST",
              "Port": $$POSTGRES_PORT,
              "MaintenanceDB": "$$POSTGRES_DB",
              "Username": "$$POSTGRES_USER",
              "SSLMode": "prefer",
              "PassFile": "/tmp/pgpass"
            }
          }
        }
        EOF
        printf '%s:%s:%s:%s:%s\n' "$$POSTGRES_HOST" "$$POSTGRES_PORT" "$$POSTGRES_DB" "$$POSTGRES_USER" "$$POSTGRES_PASSWORD" > /tmp/pgpass
        chmod 600 /tmp/pgpass
        export PGPASSFILE=/tmp/pgpass
        exec /entrypoint.sh
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  redis:
    image: redis:7
    container_name: crypto_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redisinsight:
    image: redis/redisinsight:latest
    container_name: crypto_redisinsight
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    environment:
      RI_APP_PORT: 5540
      RI_ACCEPT_TERMS_AND_CONDITIONS: "true"
      RI_ENCRYPTION_KEY: ${REDISINSIGHT_ENCRYPTION_KEY}
      RI_REDIS_HOST: redis
      RI_REDIS_PORT: 6379
      RI_REDIS_ALIAS: CryptoHub Redis
    ports:
      - "5540:5540"
    volumes:
      - redisinsight_data:/data

  prometheus:
    image: prom/prometheus:v3.5.2
    container_name: crypto_prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./infrastructure/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
    healthcheck:
      test: ["CMD", "promtool", "check", "ready", "--url=http://localhost:9090"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  loki:
    image: grafana/loki:3.7.1
    container_name: crypto_loki
    restart: always
    ports:
      - "3100:3100"
    volumes:
      - ./infrastructure/loki-config.yml:/etc/loki/config.yml:ro
      - loki_data:/loki
    command:
      - "-config.file=/etc/loki/config.yml"
    healthcheck:
      test:
        [
          "CMD",
          "/usr/bin/loki",
          "-verify-config=true",
          "-config.file=/etc/loki/config.yml",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  grafana:
    image: grafana/grafana:13.0.1
    container_name: crypto_grafana
    restart: always
    depends_on:
      prometheus:
        condition: service_healthy
      loki:
        condition: service_healthy
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASS}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infrastructure/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infrastructure/grafana/dashboards:/etc/grafana/dashboards:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fsS http://localhost:3000/api/health | grep -q '\"database\": \"ok\"'",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  postgres_data:
  pgadmin_data:
  redisinsight_data:
  prometheus_data:
  loki_data:
  grafana_data:
